[[redirects]]
  from = "/recaptcha"
  to = "/games/recaptcha"
  status = 301

[[redirects]]
  from = "/delivery"
  to = "/games/autobahn-delivery"
  status = 301

[[redirects]]
  from = "/asteroids"
  to = "/games/asteroids"
  status = 301

[[redirects]]
  from = "/pong"
  to = "/games/pong"
  status = 301

# SPA fallback: serve index.html for client-side routes (e.g. /about).
# Real files (e.g. /games/*) are matched first, so this only catches app routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  command = "git submodule update --remote && (cd public/games/recaptcha && npm ci && npm run build && cp -r dist/. .) && npm ci && npm run build"
  publish = "dist"

[build.environment]
  GIT_SUBMODULE_STRATEGY = "recursive"